#:schema https://mise.jdx.dev/schema/mise.json

[tools]
go = "1.27.3"
gotestsum = "1.13.0"
jq = "1.8.2"
git-cliff = "v2.14.2"

[tasks.dev]
description = "Bring up dev things"
run = "docker compose up -d jaeger postgres francis"

[tasks.serve]
description = "Run the app"
depends = ["dev"]
run = '''
go run main.go | (
  trap '' INT TERM
  jq
)
'''

[tasks.psk]
description = "Generate a runtime PSK"
run = "openssl rand -hex 32"

[tasks.test]
description = "Run the unit tests"
usage = 'flag "--packages <packages>" help="Go package patterns to test" default="./..."'
run = '''
gotestsum --format testname --packages "{{ usage.packages }}"
'''

[tasks.coverage]
description = "Generate an HTML Go coverage report"
run = [
  "mkdir -p reports",
  "go test ./... -coverprofile=reports/coverage.out",
  "go tool cover -html=reports/coverage.out -o reports/coverage.html",
]

[tasks.release]
description = "Release a new version of the app"
shell = "/bin/bash"
run = "./hack/release.sh"

[tasks.rename]
description = "Rename to go module"
usage = '''
arg "<module>" help="The name of the new module"
'''
run = """
find . -name "*.go" -type f | xargs -I {} sed -i '' 's~"github.com/henrywhitaker3/actor-template~"{{ usage.module }}~g' {}
sed -i '' 's~"github.com/henrywhitaker3/actor-template~"{{ usage.module }}~g' go.mod
"""
